[package]
name = "trustforge-core"
description = "Core library of TrustForge: artifact inspection and hashing. Manifests and verification follow in later milestones. Pre-alpha."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true

# Directory traversal (Unix only): openat/fstatat/readlinkat relative to a
# directory descriptor, never resolving paths below the root.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
divan.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[bench]]
name = "inspect"
harness = false

[lints]
workspace = true
