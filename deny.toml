# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`; CI runs it on every change.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check unless it is listed in `ignore` with a
# written justification.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with distributing TrustForge as
# MIT OR Apache-2.0. Additions need a justification in the pull request.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Dependencies may only come from crates.io: no git dependencies and no other
# registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
